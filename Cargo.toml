[workspace.package]
# The release version. A release-prep commit sets this to the version about to be
# cut, and a release tag that disagrees with it is rejected.
version = "0.4.0"
edition = "2024"
# Zone A (platform). Crates outside this zone declare their own license;
# see REUSE.toml for the authoritative per-path declarations.
license = "GPL-2.0-only WITH LicenseRef-Myrmic-exception-1.0"
authors = ["Peeriot GmbH <info@peeriot.io>"]
description = "Myrmic - a distributed runtime for cell-based applications"
publish = false

[profile.release]
lto = "thin"

[profile.release.package.modem-esp32]
opt-level = "s"
codegen-units = 1

[profile.release.package.esp-watchdog]
opt-level = "s"
codegen-units = 1

[profile.release.package.cell-db-service]
opt-level = "s"
codegen-units = 1

[profile.release.package.esp-network]
opt-level = "s"
codegen-units = 1

[profile.dev.package.modem-esp32]
codegen-units = 1

[profile.dev.package.esp-watchdog]
codegen-units = 1

[profile.dev.package.cell-db-service]
codegen-units = 1

[profile.dev.package.esp-network]
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# For binaries only meant to be shipped/uploaded (e.g. `myrmic` for the warehouse rack
# benchmark, run_rack.sh), not debugged locally — drops the symbol table & debug info that a
# normal release build keeps for backtraces. Same optimizations as `release` otherwise, so
# runtime behavior (incl. wasmtime/cranelift JIT codegen quality) is unaffected.
[profile.dist]
inherits = "release"
strip = true

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }

unused = { level = "warn", priority = -1 }
incomplete_features = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

similar_names = "allow"
match_wildcard_for_single_variants = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
no_effect_underscore_binding = "allow"
implicit_hasher = "allow"

cast_possible_truncation = "warn"
uninlined_format_args = "allow"
needless_continue = "allow"

# Zenoh does this via the dynamic plugins.
no_mangle_with_rust_abi = "allow"
wildcard_imports = "allow"

explicit_iter_loop = "allow"
struct_field_names = "allow"
default_trait_access = "allow"
match_same_arms = "allow"
missing_panics_doc = "allow"
single_match_else = "allow"

large_enum_variant = "allow"
result_large_err = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"

undocumented_unsafe_blocks = "deny"

