[patch.'https://github.com/peeriot/zenoh.git']
# == For Zenoh local development only ===
# When developing with a local checkout of Zenoh, uncomment ALL of these below.
# The assumption is that the `zenoh` GIT repo is checked out next to the `swarm` one.
#
# NOTE:
# The crates listed as patched below CAN be a **superset** of the Zenoh crates we
# **directly** depend on above (i.e. the patches CAN patch Zenoh crates that are transitive deps),
# but the patches CANNOT be a **subset** (i.e. one cannot patch only "a" zenoh crate she is working on ATM).
# =======================================
#zenoh = { path = "../../zenoh/zenoh" }
#zenoh-result = { path = "../../zenoh/commons/zenoh-result" }
#zenoh-config = { path = "../../zenoh/commons/zenoh-config" }
#zenoh-protocol = { path = "../../zenoh/commons/zenoh-protocol" }
#zenoh-keyexpr = { path = "../../zenoh/commons/zenoh-keyexpr" }
#zenoh-core = { path = "../../zenoh/commons/zenoh-core" }
#zenoh-buffers = { path = "../../zenoh/commons/zenoh-buffers" }
#zenoh-util = { path = "../../zenoh/commons/zenoh-util" }
#zenoh-crypto = { path = "../../zenoh/commons/zenoh-crypto" }
#zenoh-codec = { path = "../../zenoh/commons/zenoh-codec" }
#zenoh-sync = { path = "../../zenoh/commons/zenoh-sync" }
#zenoh-collections = { path = "../../zenoh/commons/zenoh-collections" }
#zenoh-macros = { path = "../../zenoh/commons/zenoh-macros" }
#zenoh-plugin-trait = { path = "../../zenoh/plugins/zenoh-plugin-trait" }
#zenoh_backend_traits = { path = "../../zenoh/plugins/zenoh-backend-traits" }
#zenoh-transport = { path = "../../zenoh/io/zenoh-transport" }
#zenoh-link-tls = { path = "../../zenoh/io/zenoh-links/zenoh-link-tls" }
#zenoh-link-tcp = { path = "../../zenoh/io/zenoh-links/zenoh-link-tcp" }
#zenoh-link-unixsock_stream = { path = "../../zenoh/io/zenoh-links/zenoh-link-unixsock_stream" }
#zenoh-link-quic = { path = "../../zenoh/io/zenoh-links/zenoh-link-quic" }
#zenoh-link-udp = { path = "../../zenoh/io/zenoh-links/zenoh-link-udp" }
#zenoh-link-ws = { path = "../../zenoh/io/zenoh-links/zenoh-link-ws" }
#zenoh-link = { path = "../../zenoh/io/zenoh-link" }
#zenoh-link-commons = { path = "../../zenoh/io/zenoh-link-commons" }
#zenoh-link-bt-gatt = { path = "../../zenoh/io/zenoh-links/zenoh-link-bt-gatt" }
#zenoh-runtime = { path = "../../zenoh/commons/zenoh-runtime" }
#zenoh-task = { path = "../../zenoh/commons/zenoh-task" }
#zenoh-plugin-storage-manager = { path = "../../zenoh/plugins/zenoh-plugin-storage-manager" }
# =======================================

