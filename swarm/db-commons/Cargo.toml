[package]
name = "db-commons"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
std = ["serde/std", "dep:anyhow"]
models = ["dep:postcard", "dep:hex", "dep:sha2", "serde/derive", "dep:vecmap-rs"]
topics = ["dep:uhlc"]
replica = ["std", "models", "topics"]
query = ["dep:zenoh", "dep:tracing", "dep:anyhow", "dep:postcard"]

[dependencies]
uhlc = { workspace = true, default-features = false, optional = true }
zenoh = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
vecmap-rs = { workspace = true, optional = true, features = ["serde"] }

serde = { workspace = true, default-features = false }
postcard = { workspace = true, optional = true }
