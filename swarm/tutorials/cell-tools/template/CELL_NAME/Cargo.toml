[package]
name = "CELL_NAME"
version.workspace = true
edition.workspace = true
license = "MIT-0"
publish = false

[features]
default = ["cell-impl", "cell-client"]
cell-impl = []
cell-client = []

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

[dependencies]
myrmic-sdk = { workspace = true, features = ["alloc", "cells"] }
myrmic-sdk-macros = { workspace = true }
serde = { workspace = true, features = ["derive", "alloc"] }
postcard = { workspace = true, default-features = false }
