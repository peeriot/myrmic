name: "http"
base_url: "http://localhost:10000"

types:
  definitions:
    TestResponse:
      type: object
      required: [body]
      properties:
        body:
          type: string

endpoints:
  - id: test
    request:
      method: GET
      path: "/test"
      timeout_ms: 5000
    response:
      200: "${json:TestResponse}"
