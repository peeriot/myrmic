networks:
  network_a:
  network_b:

x-service-template: &service-template
  image: "swarm:network_tests"
  environment:
    # important for e2e tests to work
    - RUST_LOG=debug
  expose:
    - 80
  restart: no
  stop_signal: SIGINT
  privileged: true
  cap_add:
    - NET_ADMIN

# Services

services:
  sidecar:
    image: "sidecar:network_tests"
    restart: no
    stop_signal: SIGINT
    depends_on:
      - router
    networks:
      network_a:
    ports:
      - "127.0.0.1:8080:8080"
    command: ["test-sidecar"]

  ##########
  # Router #
  ##########

  router:
    <<: *service-template
    networks:
      network_a:
      network_b:
    command: ["swarm", "/etc/peeriot/swarm/test_router.jsonnet"]

  #############
  # Network A #
  #############

  peer_a:
    <<: *service-template
    networks:
      network_a:
    depends_on:
      - router
    command: ["swarm", "/etc/peeriot/swarm/test_peer.jsonnet"]
    deploy:
      mode: replicated
      replicas: 5

  #############
  # Network B #
  #############

  peer_b:
    <<: *service-template
    networks:
      network_b:
    depends_on:
      - router
    command: ["swarm", "/etc/peeriot/swarm/test_peer.jsonnet"]
    deploy:
      mode: replicated
      replicas: 5
