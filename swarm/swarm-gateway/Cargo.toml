[package]
name = "swarm-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }

axum = { workspace = true, features = ["ws"] }
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros"] }
zenoh = { workspace = true, features = ["unstable"] }

cell-protocol = { workspace = true, default-features = true }
sorg-common = { workspace = true }
db-client = { workspace = true, features = ["zenoh"] }
myrmic-common = { workspace = true }

futures-util = { workspace = true, features = ["std", "sink"] }
uuid = { workspace = true, features = ["v4"] }
mime_guess = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true, features = ["std"] }

reqwest = { workspace = true }
openidconnect = { workspace = true }
tower-sessions = { workspace = true }
