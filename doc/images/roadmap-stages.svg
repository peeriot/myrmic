<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="980pt" height="180pt" viewBox="0 0 980 180" xmlns="http://www.w3.org/2000/svg">
<title>Myrmic roadmap: Basic Cell, Partition Tolerance, Durability, Secure Swarm</title>
<g font-family="DejaVu Sans" font-size="10" text-anchor="middle">

<!-- Basic Cell -->
<rect x="18" y="12" width="194" height="103" rx="6" fill="#eaf2ff" stroke="#4472c4"/>
<text x="115" y="27" font-weight="bold">BASIC CELL</text>
<text x="115" y="39">Available today · Developer Preview</text>
<text x="115" y="61">Cells addressed by SRI · Mailboxes</text>
<text x="115" y="72">Placement by capability tags</text>
<text x="115" y="83">Linux and MCU WebAssembly</text>
<text x="115" y="94">Native Signal Layer</text>
<text x="115" y="105">Predictable remove and report</text>

<!-- arrow 1 -->
<path fill="none" stroke="#6b7785" stroke-width="1.4" d="M212,63.5 L244,63.5"/>
<polygon fill="#6b7785" stroke="#6b7785" stroke-width="1.4" points="244,60.9 251.5,63.5 244,66.1"/>

<!-- Partition Tolerance -->
<rect x="252" y="12" width="196" height="103" rx="6" fill="#fff2cc" stroke="#d6a100" stroke-dasharray="5,2"/>
<text x="350" y="27" font-weight="bold">PARTITION TOLERANCE</text>
<text x="350" y="39">Control survives failures</text>
<text x="350" y="61">A voter set per Cell instance</text>
<text x="350" y="72">Voters elect a leader by majority</text>
<text x="350" y="83">Fencing allows one serving copy</text>
<text x="350" y="94">Cells declare recovery models</text>
<text x="350" y="105">Deploy and stop are acknowledged</text>

<!-- arrow 2 -->
<path fill="none" stroke="#6b7785" stroke-width="1.4" d="M448,63.5 L480,63.5"/>
<polygon fill="#6b7785" stroke="#6b7785" stroke-width="1.4" points="480,60.9 487.5,63.5 480,66.1"/>

<!-- Durability -->
<rect x="488" y="12" width="244" height="103" rx="6" fill="#e6f4ea" stroke="#3a9a5b" stroke-dasharray="5,2"/>
<text x="610" y="27" font-weight="bold">DURABILITY</text>
<text x="610" y="39">State survives failures</text>
<text x="610" y="61">State and Mailboxes replicated across Nodes</text>
<text x="610" y="72">Cell resumes on an eligible Node</text>
<text x="610" y="83">Cross-Node delivery joins the transaction</text>
<text x="610" y="94">Request identity · durable timers</text>

<!-- arrow 3 -->
<path fill="none" stroke="#6b7785" stroke-width="1.4" d="M732,63.5 L764,63.5"/>
<polygon fill="#6b7785" stroke="#6b7785" stroke-width="1.4" points="764,60.9 771.5,63.5 764,66.1"/>

<!-- Secure Swarm -->
<rect x="772" y="12" width="190" height="103" rx="6" fill="#f4f6f8" stroke="#98a2ad" stroke-dasharray="5,2"/>
<text x="867" y="27" font-weight="bold">SECURE SWARM</text>
<text x="867" y="39">Operational maturity</text>
<text x="867" y="61">Authenticated fabric</text>
<text x="867" y="72">Reconfiguration · self-healing</text>
<text x="867" y="83">Upgrade semantics</text>
<text x="867" y="94">Declared Convergent merge rules</text>

<!-- equation -->
<text x="490" y="163" font-size="28.8"><tspan fill="#4472c4">Basic Cell</tspan><tspan fill="#6b7785"> + </tspan><tspan fill="#d6a100">Partition Tolerance</tspan><tspan fill="#6b7785"> + </tspan><tspan fill="#3a9a5b">Durability</tspan><tspan fill="#6b7785"> = </tspan><tspan fill="#1d2530" font-weight="bold">Sovereign Cells</tspan></text>

</g>
</svg>
