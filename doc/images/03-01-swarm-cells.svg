<!-- ═══ ARROWS ═══ -->

<!-- EVENT 1: cell-7 (N3) → cell-1 (N1)  — arc above entire top row -->
<path stroke-dasharray="7 5" d="M 762 125 C 680 40 220 40 138 125"
      fill="none" stroke="#4F46E5" stroke-width="1.8" marker-end="url(#me)"/>
<text x="450" y="34" fill="#4F46E5" font-family="system-ui,sans-serif"
      font-size="8" text-anchor="middle" font-weight="600">event</text>

<!-- EVENT 2: cell-7 (N3) → cell-3 (N2)  — in gap between N2 and N3 -->
<path stroke-dasharray="7 5" d="M 762 130 C 700 116 578 116 494 130"
      fill="none" stroke="#4F46E5" stroke-width="1.8" marker-end="url(#me)"/>
<text x="628" y="110" fill="#4F46E5" font-family="system-ui,sans-serif"
      font-size="8" text-anchor="middle" font-weight="600">event</text>

<!-- EVENT 3: cell-11 (N5) → cell-9 (N4)  — in gap between N4 and N5 -->
<path stroke-dasharray="7 5" d="M 406 382 C 336 370 240 370 138 382"
      fill="none" stroke="#4F46E5" stroke-width="1.8" marker-end="url(#me)"/>
<text x="272" y="364" fill="#4F46E5" font-family="system-ui,sans-serif"
      font-size="8" text-anchor="middle" font-weight="600">event</text>

<!-- EVENT 4: cell-12 (N5) → cell-13 (N6)  — in gap between N5 and N6 -->
<path stroke-dasharray="7 5" d="M 494 382 C 564 370 680 370 762 382"
      fill="none" stroke="#4F46E5" stroke-width="1.8" marker-end="url(#me)"/>
<text x="638" y="364" fill="#4F46E5" font-family="system-ui,sans-serif"
      font-size="8" text-anchor="middle" font-weight="600">event</text>

<!-- COMMAND 5: cell-4 (N2) → cell-13 (N6)  — diagonal, top-center to bottom-right -->
<path d="M 494 148 C 624 228 714 300 762 378"
      fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#mc)"/>
<text x="656" y="250" fill="#D97706" font-family="system-ui,sans-serif"
      font-size="8" text-anchor="middle" font-weight="600">command</text>

<!-- COMMAND 6: cell-5 (N2) → cell-10 (N4)  — diagonal, top-center to bottom-left -->
<path d="M 416 200 C 336 254 234 308 138 378"
      fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#mc)"/>
<text x="294" y="264" fill="#D97706" font-family="system-ui,sans-serif"
      font-size="8" text-anchor="middle" font-weight="600">command</text>

<!-- COMMAND 7: cell-2 (N1) → cell-9 (N4)  — same column, through inter-row gap -->
<path d="M 110 152 C 20 200 15 300 50 368"
      fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#mc)"/>
<text x="65" y="240" fill="#D97706" font-family="system-ui,sans-serif"
      font-size="8" text-anchor="middle" font-weight="600">command</text>

<!-- ═══ LEGEND ═══ -->
<rect x="248" y="444" width="378" height="38" rx="10"
      fill="white" stroke="#E2E8F0" stroke-width="1"/>
<line x1="272" y1="463" x2="306" y2="463"
      stroke="#4F46E5" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#me)"/>
<text x="320" y="460" fill="#334155" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600">Event</text>
<text x="320" y="473" fill="#94A3B8" font-family="system-ui,sans-serif" font-size="9">broadcast to all subscribers</text>
<line x1="458" y1="463" x2="492" y2="463"
      stroke="#D97706" stroke-width="2" marker-end="url(#mc)"/>
<text x="506" y="460" fill="#334155" font-family="system-ui,sans-serif" font-size="10.5" font-weight="600">Command</text>
<text x="506" y="473" fill="#94A3B8" font-family="system-ui,sans-serif" font-size="9">directed to a specific cell</text>
</svg>
