<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="760" height="290" viewBox="0 0 760 290" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans" font-size="10.5" fill="#6b7785">
  <title>The finished greenhouse across three nodes</title>
  <text x="380" y="24" text-anchor="middle" font-size="14">The whole greenhouse, resilient</text>
  <!-- node1 -->
  <rect x="30" y="56" width="200" height="190" rx="6" fill="#f4f6f8" stroke="#98a2ad"/>
  <text x="130" y="78" text-anchor="middle" font-size="12" fill="#3d4650">node1 · soil-probe</text>
  <rect x="55" y="96" width="150" height="36" rx="4" fill="#eaf2ff" stroke="#4472c4"/>
  <text x="130" y="118" text-anchor="middle" fill="#3d4650">moisture-sensor</text>
  <text x="130" y="160" text-anchor="middle" font-size="9.5">tags: [soil-probe]</text>
  <text x="130" y="174" text-anchor="middle" font-size="9.5">restart: always</text>
  <text x="130" y="226" text-anchor="middle" font-size="9.5">no replicas here</text>
  <!-- node2 -->
  <rect x="290" y="56" width="200" height="190" rx="6" fill="#f4f6f8" stroke="#98a2ad"/>
  <text x="390" y="78" text-anchor="middle" font-size="12" fill="#3d4650">node2 · compute</text>
  <rect x="315" y="96" width="150" height="34" rx="4" fill="#eaf2ff" stroke="#4472c4"/>
  <text x="390" y="117" text-anchor="middle" fill="#3d4650">grow-bed</text>
  <rect x="315" y="138" width="150" height="34" rx="4" fill="#eaf2ff" stroke="#4472c4"/>
  <text x="390" y="159" text-anchor="middle" fill="#3d4650">irrigation-agent</text>
  <rect x="315" y="192" width="150" height="34" rx="4" fill="#ffffff" stroke="#4472c4" stroke-dasharray="4 3"/>
  <text x="390" y="213" text-anchor="middle" fill="#3d4650">state of all four cells</text>
  <!-- node3 -->
  <rect x="530" y="56" width="200" height="190" rx="6" fill="#f4f6f8" stroke="#98a2ad"/>
  <text x="630" y="78" text-anchor="middle" font-size="12" fill="#3d4650">node3 · compute</text>
  <rect x="555" y="96" width="150" height="34" rx="4" fill="#eaf2ff" stroke="#4472c4"/>
  <text x="630" y="117" text-anchor="middle" fill="#3d4650">pump</text>
  <rect x="555" y="138" width="150" height="34" rx="4" fill="#eaf2ff" stroke="#4472c4"/>
  <text x="630" y="159" text-anchor="middle" fill="#3d4650">dashboard</text>
  <rect x="555" y="192" width="150" height="34" rx="4" fill="#ffffff" stroke="#4472c4" stroke-dasharray="4 3"/>
  <text x="630" y="213" text-anchor="middle" fill="#3d4650">state of all four cells</text>
  <line x1="470" y1="209" x2="550" y2="209" stroke="#4472c4" stroke-width="1.2"/>
  <text x="510" y="201" text-anchor="middle" font-size="9.5" fill="#4472c4">replicate app:greenhouse -t compute</text>
  <text x="380" y="272" text-anchor="middle" font-size="9.5">Placement and restart come from app_specs.yml; replication is set on the swarm with the CLI. Your split of the four cells may differ.</text>
</svg>
