<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="760" height="330" viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans" font-size="10.5" fill="#6b7785">
  <rect id="bg" x="0" y="0" width="760" height="330" fill="#ffffff"/>
  <title>Scaling tutorial · roots and their children</title>
  <text x="380" y="24" text-anchor="middle" font-size="14">Three roots, any number of beds and sensors</text>
  <!-- node1 -->
  <rect x="30" y="56" width="200" height="220" rx="6" fill="#f4f6f8" stroke="#98a2ad"/>
  <text x="130" y="78" text-anchor="middle" font-size="12" fill="#3d4650">node1 · pi-north</text>
  <text x="130" y="93" text-anchor="middle" font-size="9.5">the Raspberry Pi with the probes</text>
  <rect x="55" y="110" width="150" height="30" rx="4" fill="#eaf2ff" stroke="#4472c4"/>
  <text x="130" y="129" text-anchor="middle" fill="#3d4650">sensor-root/sensor-1</text>
  <rect x="55" y="150" width="150" height="30" rx="4" fill="#eaf2ff" stroke="#4472c4"/>
  <text x="130" y="169" text-anchor="middle" fill="#3d4650">sensor-root/sensor-2</text>
  <rect x="55" y="190" width="150" height="30" rx="4" fill="none" stroke="#98a2ad" stroke-dasharray="4 3"/>
  <text x="130" y="209" text-anchor="middle">sensor-root/sensor-3 ...</text>
  <text x="130" y="248" text-anchor="middle" font-size="9.5">spawned with .tag("pi-north")</text>
  <text x="130" y="262" text-anchor="middle" font-size="9.5">by sensor-root</text>
  <!-- node2 -->
  <rect x="290" y="56" width="200" height="220" rx="6" fill="#f4f6f8" stroke="#98a2ad"/>
  <text x="390" y="78" text-anchor="middle" font-size="12" fill="#3d4650">node2 · compute</text>
  <text x="390" y="93" text-anchor="middle" font-size="9.5">spare box</text>
  <rect x="315" y="110" width="150" height="30" rx="4" fill="#fff4e0" stroke="#c48a2a"/>
  <text x="390" y="129" text-anchor="middle" fill="#3d4650">sensor-root</text>
  <rect x="315" y="150" width="150" height="30" rx="4" fill="#eaf2ff" stroke="#4472c4"/>
  <text x="390" y="169" text-anchor="middle" fill="#3d4650">bed-root/bed-1</text>
  <rect x="315" y="190" width="150" height="30" rx="4" fill="#eaf2ff" stroke="#4472c4"/>
  <text x="390" y="209" text-anchor="middle" fill="#3d4650">bed-root/bed-3</text>
  <text x="390" y="248" text-anchor="middle" font-size="9.5">roots: restart: always</text>
  <text x="390" y="262" text-anchor="middle" font-size="9.5">beds: spawned with .tag("compute")</text>
  <!-- node3 -->
  <rect x="530" y="56" width="200" height="220" rx="6" fill="#f4f6f8" stroke="#98a2ad"/>
  <text x="630" y="78" text-anchor="middle" font-size="12" fill="#3d4650">node3 · compute</text>
  <text x="630" y="93" text-anchor="middle" font-size="9.5">spare box</text>
  <rect x="555" y="110" width="150" height="30" rx="4" fill="#fff4e0" stroke="#c48a2a"/>
  <text x="630" y="129" text-anchor="middle" fill="#3d4650">bed-root</text>
  <rect x="555" y="150" width="150" height="30" rx="4" fill="#fff4e0" stroke="#c48a2a"/>
  <text x="630" y="169" text-anchor="middle" fill="#3d4650">dashboard</text>
  <rect x="555" y="190" width="150" height="30" rx="4" fill="#eaf2ff" stroke="#4472c4"/>
  <text x="630" y="209" text-anchor="middle" fill="#3d4650">bed-root/bed-2</text>
  <text x="630" y="248" text-anchor="middle" font-size="9.5">Your split of roots and beds</text>
  <text x="630" y="262" text-anchor="middle" font-size="9.5">over the compute nodes may differ</text>
  <!-- legend -->
  <rect x="200" y="296" width="14" height="10" rx="2" fill="#fff4e0" stroke="#c48a2a"/>
  <text x="220" y="305" font-size="9.5">root cell, deployed from app_specs.yml</text>
  <rect x="430" y="296" width="14" height="10" rx="2" fill="#eaf2ff" stroke="#4472c4"/>
  <text x="450" y="305" font-size="9.5">child cell, spawned by a root at runtime</text>
</svg>
