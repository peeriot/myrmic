[package]
name = "chatty"
version.workspace = true
edition.workspace = true
license = "MIT-0"
authors.workspace = true
publish.workspace = true

[package.metadata.myrmic]
# The front end is compiled into the cell (see src/bin/chatty.rs), so ~400 KiB
# of assets sit in the data segment on top of the usual stack and heap. The
# 128 KiB defaults are nowhere near enough.
heap_size = 131_072
stack_size = 65_536
initial_memory = 1_048_576
max_memory = 1_048_576

[dependencies]
myrmic-sdk = { workspace = true, features = ["db"] }

serde = { workspace = true }

textus = { workspace = true }
