[package]
name = "spawn"
version.workspace = true
edition.workspace = true
license = "MIT-0"
authors.workspace = true
publish.workspace = true

[package.metadata.myrmic]
heap_size = 65_536

# Two cells in one crate: each binary is built as its own class
# (`parent` / `child`) — see app-specs.yml.
[[bin]]
name = "parent"
path = "src/bin/parent.rs"

[[bin]]
name = "child"
path = "src/bin/child.rs"

[dependencies]
myrmic-sdk = { workspace = true, features = ["alloc", "db", "cells", "cell-init"] }

serde_json = { workspace = true }
