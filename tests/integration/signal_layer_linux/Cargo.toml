# Integration tests for the Linux Signal Layer end-to-end pipeline.
#
# This crate is NOT a member of the root workspace because the root Cargo.toml
# is Task-1-owned.  Run these tests explicitly:
#
#   cargo nextest run \
#       --manifest-path tests/integration/signal_layer_linux/Cargo.toml
#
#   # or with plain cargo test:
#   cargo test \
#       --manifest-path tests/integration/signal_layer_linux/Cargo.toml
#
# SR-Trace: SR-10(a)(b) [ABI conformance, e2e], SR-14 [health events],
#           SR-16(a) [socket mode 0660], SR-2 [unmodified moving-average].

[workspace]
resolver = "2"
members  = ["." ]

[package]
name    = "signal-layer-linux-e2e"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only WITH LicenseRef-Myrmic-exception-1.0"
publish = false

[lib]
name = "signal_layer_linux_e2e"

[dependencies]
signal-layer-ipc      = { path = "../../../sdk/signal-layer/signal-layer-ipc" }
signal-layer-linux-rt = { path = "../../../swarm/signal-layer/signal-layer-linux-rt" }
sorg-execution        = { path = "../../../swarm/sorg-execution" }
signal-layer-types    = { path = "../../../sdk/signal-layer/signal-layer-types", package = "myrmic-signal-layer-types", default-features = false, features = ["postcard"] }
signal-layer-core     = { path = "../../../sdk/signal-layer/signal-layer-core" }
moving-average        = { path = "../../../signal-modules/steps/moving-average" }

postcard  = { version = "1.1.3", default-features = false, features = ["alloc"] }
tokio     = { version = "1.44.2", default-features = false, features = ["net", "io-util", "rt-multi-thread", "macros", "time", "sync"] }
wasmtime  = "43.0.2"
tempfile  = "3.17.1"

[lints.rust]
future_incompatible        = { level = "warn", priority = -1 }
nonstandard_style          = { level = "warn", priority = -1 }
unused                     = { level = "warn", priority = -1 }

[lints.clippy]
pedantic                   = { level = "warn", priority = -1 }
missing_errors_doc         = "allow"
module_name_repetitions    = "allow"
