name: Public Validation

# The validation the public mirror runs. It exists because master is mirrored to
# peeriot/myrmic verbatim, and the internal workflows cannot run there: they need
# private actions, the private CI image and the self-hosted runners.
#
# This one needs none of that. No secrets, no organisation variables, no private
# actions, so it resolves and runs in a public repository and in a fork of it.
#
# It is not a second definition of what gets checked. It calls `.ci/check/check`
# with the package list from `.ci/check/test-packages`, the same as the internal
# `check_swarm` job in internal-validation.yml. Only the way it is started differs.

on:
  push:
    branches:
      - master
  pull_request:
    types: [ 'opened', 'reopened', 'synchronize', 'ready_for_review' ]
  workflow_dispatch:

jobs:

  # `ubuntu-latest` is written out literally rather than derived from an
  # expression. The public repository can reach the self-hosted runners, so a
  # label that resolved to one would put pull request code on our own machines.
  #
  # Split in two because every fork pull request starts from a cold cache, and a
  # formatting error should surface in minutes rather than after the full test run.

  guidelines:
    name: Guidelines
    runs-on: ubuntu-latest
    if: github.repository == 'peeriot/myrmic'
    permissions:
      contents: read
    concurrency:
      group: guidelines-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: guidelines
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Check
        run: .ci/check/check
        env:
          SKIP_TESTS: "true"

  tests:
    name: Tests
    runs-on: ubuntu-latest
    if: github.repository == 'peeriot/myrmic'
    permissions:
      contents: read
    concurrency:
      group: tests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # Frees ~17 GB, because this build needs more than the ~14 GB a hosted
      # runner guarantees and nothing here is built against Android or .NET.
      #
      # The tool cache and the preinstalled apt packages would add another 11 GB
      # but hold interpreters a build script may reach for. The swap file would
      # add 4 GB and is deliberately left alone: this job gets 8 GB of RAM in a
      # private repository, and linkers are the memory-hungry part, so trading
      # memory for disk here only moves the failure.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet

      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # `cargo citest` is an alias for `cargo nextest run`. Installed from the
      # upstream release rather than through a third-party action to keep this
      # job's supply chain to actions/* plus one pinned cache action.
      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      # This job has run out of disk twice. Reported on both sides of the build,
      # and after it even when it failed, so a next time comes with the numbers
      # rather than an estimate of them.
      - name: Disk space before the build
        run: df -h

      - name: Test
        run: .ci/check/check
        env:
          SKIP_CHECKS: "true"
          # A hosted runner has ~14 GB, and this workspace does not fit twice.
          # The binaries and the tests resolve features differently, so cargo
          # keeps two artifact sets whatever the order, and measured on this
          # workspace two thirds of an artifact is debug info. Line tables are
          # the part a failure backtrace needs, so they stay. The `test` profile
          # inherits this from `dev`.
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          # nextest defaults to one test per core. Several integration tests
          # compile a cell fixture at test runtime, optimized, which is seconds
          # of rustc inside the test's own clock, and the deploy that follows it
          # gives up after 15s. Two of those on the two cores a private
          # repository gets starve each other past that deadline; the mirror's
          # four cores hide it. Serial trades a few minutes of a job that
          # already spends twenty on compiling for a result that means something.
          NEXTEST_TEST_THREADS: "1"

      - name: Disk space after the build
        if: always()
        run: |
          df -h
          du -sh target 2>/dev/null || true
