# Quickstart: Black Duck Security Scan Action with blackducksca:
#     https://docs.blackduck.com/r/bridge/latest/bridge-cli-guide/quickstart-black-duck-security-scan-action-with-black-duck-sca.html
#
# You can use this command to execute the Scan locally
# bash <(curl -s -L https://detect.blackduck.com/detect.sh) \
#   --blackduck.url="https://peeriot.app.blackduck.com" \
#   --blackduck.api.token="<token>" \
#   --detect.project.name="<project>" \
#   --detect.project.version.name="<version>" \
#   --detect.wait.for.results=true

name: Black Duck Security Scan
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch: {}
jobs:
  blackducksca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Black Duck Security Scan
        id: black-duck-security-scan
        uses: blackduck-inc/black-duck-security-scan@v2
        env:
          DETECT_PROJECT_NAME: "Myrmic"
          DETECT_PROJECT_VERSION_NAME: "current"
        with:
          blackducksca_url: ${{ vars.BLACKDUCKSCA_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCK_TOKEN }}
          blackducksca_scan_full: true
