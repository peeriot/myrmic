name: Notify CI

# Tells another repository's CI that there is work, since it cannot see events here.
# It reports what happened and does not decide what runs; the router on the other
# side does that from the payload.
on:
  push:
    branches: [master]
    tags: ['myrmic/v*']
  release:
    types: [published]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  dispatch:
    name: Dispatch
    # Unset in a repository not wired up yet: do nothing rather than fail.
    if: vars.CI_REPO != ''
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: token
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_SECRET }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.CI_REPO }}

      - name: Tell CI there is work
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TARGET: ${{ github.repository_owner }}/${{ vars.CI_REPO }}
          # Post against the sha the pull request shows, not the merge result.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event.pull_request.number }}
          PRIVATE: ${{ github.event.repository.private }}
          DRAFT: ${{ github.event.pull_request.draft }}
          HIL: ${{ contains(github.event.pull_request.labels.*.name, 'hil') }}
          REVIEW: ${{ github.event.review.state }}
        run: |
          set -euo pipefail
          gh api -X POST "/repos/${TARGET}/dispatches" \
            -f event_type=ci \
            -F "client_payload[repo]=${GITHUB_REPOSITORY}" \
            -F "client_payload[event]=${GITHUB_EVENT_NAME}" \
            -F "client_payload[ref]=${GITHUB_REF}" \
            -F "client_payload[head_sha]=${HEAD_SHA}" \
            -F "client_payload[pr]=${PR:-}" \
            -F "client_payload[private]=${PRIVATE:-false}" \
            -F "client_payload[draft]=${DRAFT:-false}" \
            -F "client_payload[hil]=${HIL:-false}" \
            -F "client_payload[review]=${REVIEW:-}"
