name: Notify CI

# Tells another repository's CI that there is work, since it cannot see events here.
# It reports what happened and does not decide what runs; the router on the other
# side does that from the payload, with the tests .ci/tests.ref pins.
on:
  # The nightly: 02:37 Berlin summer time, 01:37 in winter.
  schedule:
    - cron: '37 0 * * *'
  push:
    branches: [master]
    tags: ['myrmic/v*']
  release:
    types: [published]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

jobs:
  dispatch:
    name: Dispatch
    # Unset in a repository not wired up yet: do nothing rather than fail. A draft
    # pull request has nothing to report until it is marked ready.
    if: >-
      vars.CI_REPO != '' && !github.event.pull_request.draft &&
      (github.event_name != 'issue_comment' ||
        (github.event.issue.pull_request && contains(github.event.comment.body, '/e2e')))
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Read the command
        id: command
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.comment.body }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if ! grep -qE '^[[:space:]]*/e2e[[:space:]]*$' <<<"$BODY"; then
            echo "run=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" \
            --jq '"head_sha=\(.head.sha)\ndraft=\(.draft)"' >>"$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@v2
        id: token
        if: steps.command.outputs.run != 'false'
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_SECRET }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.CI_REPO }}

      - name: Tell CI there is work
        if: steps.command.outputs.run != 'false'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TARGET: ${{ github.repository_owner }}/${{ vars.CI_REPO }}
          # Post against the sha the pull request shows, not the merge result.
          HEAD_SHA: ${{ steps.command.outputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          # What happened to the pull request, e.g. `opened`, `synchronize` or `labeled`,
          # and for `labeled` the label added.
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          PRIVATE: ${{ github.event.repository.private }}
          DRAFT: ${{ steps.command.outputs.draft || github.event.pull_request.draft }}
          # A comment's event knows the pull request as an issue.
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
          REVIEW: ${{ github.event.review.state }}
          # How the reviewer or commenter relates to the repository, e.g. MEMBER or NONE.
          REVIEWER: ${{ github.event.review.author_association || github.event.comment.author_association }}
        # The pull request's fields go under `pr` and `review`: a dispatch payload takes at
        # most 10 top-level properties.
        # `-f` sends strings as they are, `-F` turns numbers and booleans into JSON ones.
        run: |
          set -euo pipefail
          # One field per label; `labels[]` without a value is the empty list.
          label_fields=()
          while IFS= read -r name; do
            label_fields+=(-f "client_payload[pr][labels][]=$name")
          done < <(jq -nr --argjson pr "$PR_LABELS" --argjson issue "$ISSUE_LABELS" '($pr // []) + ($issue // []) | .[]')
          if [ "${#label_fields[@]}" -eq 0 ]; then label_fields=(-F "client_payload[pr][labels][]"); fi
          gh api -X POST "/repos/${TARGET}/dispatches" \
            -f event_type=ci \
            -f "client_payload[repo]=${GITHUB_REPOSITORY}" \
            -f "client_payload[event]=${GITHUB_EVENT_NAME}" \
            -f "client_payload[action]=${ACTION}" \
            -f "client_payload[ref]=${GITHUB_REF}" \
            -f "client_payload[head_sha]=${HEAD_SHA}" \
            -F "client_payload[private]=${PRIVATE:-false}" \
            -F "client_payload[pr][number]=${PR:-}" \
            -F "client_payload[pr][draft]=${DRAFT:-false}" \
            "${label_fields[@]}" \
            -f "client_payload[pr][label]=${LABEL}" \
            -f "client_payload[review][state]=${REVIEW}" \
            -f "client_payload[review][reviewer]=${REVIEWER}"
