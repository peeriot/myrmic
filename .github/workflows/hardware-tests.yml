        run: |
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          git config --global --add safe.directory /__w/swarm/swarm
      - name: Setup
        uses: "peeriot/actions/setup@f1de69144739ce6bb25250bbb9096d3632574163"
        id: setup
        with:
          app-id: ${{ vars.CI_APP_ID }}
          access-private-key: ${{ secrets.CI_APP_SECRET }}
      # The signal-layer suite needs the pipeline compiled into the firmware. Without this the
      # taps do not exist and those tests cannot pass, whatever the rig is wired to.
      - name: Generate signal-layer pipeline (esp32c61-hil)
        run: |
          sdk/signal-layer/scripts/pipeline_regen.sh hil-tests --board esp32c61-hil --target esp32c61
      # REQ-FEAT-2026-HWD-SEC-002 asserts what a *shipped* build does, so its test needs an image
      # without the test features. Built first and copied aside, so the wdt-selftest build below
      # leaves the default ELF path holding the image the rest of the suite flashes.
