      # The signal-layer suite needs the pipeline compiled into the firmware. Without this the
      # taps do not exist and those tests cannot pass, whatever the rig is wired to.
      - name: Generate signal-layer pipeline (esp32c6-hil)
        run: |
          sdk/signal-layer/scripts/pipeline_regen.sh hil-tests --board esp32c6-hil --target esp32c6
      # REQ-FEAT-2026-HWD-SEC-002 asserts what a *shipped* build does, so its test needs an image
      # without the test features. Built first and copied aside, so the wdt-selftest build below
      # leaves the default ELF path holding the image the rest of the suite flashes.
      - name: Build embedded firmware (C6, production profile)
        run: |
          CARGO_NET_GIT_FETCH_WITH_CLI=true CARGO_BUILD_JOBS=8 WIFI_SSID="${{ secrets.HARDWARE_TESTS_WIFI_SSID }}" WIFI_PASS="${{ secrets.HARDWARE_TESTS_WIFI_PASS }}" ESP_LOG=info TCP_DIRECT_ADDR="${{ secrets.HARDWARE_TESTS_RUNNER_IP }}":7447 cargo +nightly build-c6
          cp target/riscv32imac-unknown-none-elf/release/modem-esp32 target/modem-esp32-production
      - name: Build embedded firmware (C6)
        run: |
          CARGO_NET_GIT_FETCH_WITH_CLI=true CARGO_BUILD_JOBS=8 WIFI_SSID="${{ secrets.HARDWARE_TESTS_WIFI_SSID }}" WIFI_PASS="${{ secrets.HARDWARE_TESTS_WIFI_PASS }}" ESP_LOG=info TCP_DIRECT_ADDR="${{ secrets.HARDWARE_TESTS_RUNNER_IP }}":7447 cargo +nightly build-c6 --features wdt-selftest
      - name: Build swarm (host binary)
        run: |
          CARGO_NET_GIT_FETCH_WITH_CLI=true CARGO_BUILD_JOBS=8 cargo build --bin swarm
      # We don't have isolation between boards/execs/tests. So make sure that no other board can be accidentally be
      # picked up.
      - name: Silence sibling boards
        run: |
          for p in /dev/esp32-*; do
            [ -e "$p" ] || continue
            if [ "$p" != "$ESPFLASH_PORT" ]; then
              echo "Erasing sibling $p"
              cargo espflash erase-flash --port "$p" || echo "WARN: could not erase $p"
            fi
          done
      # No sensors are wired to the dev-server rig, so the four tests that read one skip
      # themselves and say so in the log. Add HIL_SENSORS=1 once sensors are installed:
      #   HIL_SENSORS=1 CARGO_NET_GIT_FETCH_WITH_CLI=true ... cargo nextest run -p hil-tests ...
      - name: Run tests
        run: |
          CARGO_NET_GIT_FETCH_WITH_CLI=true CARGO_BUILD_JOBS=8 TCP_DIRECT_ADDR="${{ secrets.HARDWARE_TESTS_RUNNER_IP }}":7447 EMBEDDED_TARGET=ESP32C6 EMBEDDED_ELF_PRODUCTION="$PWD/target/modem-esp32-production" cargo nextest run -p hil-tests --no-fail-fast --no-capture

  hil-esp32c61:
    runs-on: hardware
    # Runs after the C6 board so only one HIL job uses the hardware runner at a time.
    needs: hil-esp32c6
    if: ${{ !cancelled() }}
    container:
      image: "ghcr.io/peeriot/rust-riscv32imac-unknown-none-elf:1.95.0"
      env:
        HOST_UID: ${{ vars.ACTIONS_RUNNER_UID }}
        HOST_GID: ${{ vars.ACTIONS_RUNNER_GID }}
        DIALOUT_GID: 20
        ESPFLASH_PORT: /dev/esp32-c61-1
