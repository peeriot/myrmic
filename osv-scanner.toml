# lru is transitive: sorg-orchestration -> genetic_algorithm 0.27.2 -> lru 0.16.4.
# genetic_algorithm declares lru = "0.16.3", so cargo cannot reach the patched 0.18.2, there is
# no patched 0.16.x, and 0.27.2 is the latest genetic_algorithm release.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0253"
reason = "Unsoundness in lru::LruCache::pop(), reachable only if a stored key's Drop implementation panics. genetic_algorithm keys the cache on GenesHash (= u64), which has no Drop, and never calls pop() — so the reported case cannot occur here. Revisit when genetic_algorithm bumps lru past 0.18.2."

