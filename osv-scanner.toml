# crypto-bigint 0.5 has secret-dependent timing in arithmetic meant to be constant-time; the fix is
# only in 0.7.6, which needs p256 0.14. openidconnect 4.0.1 and embedded-tls 0.19, the latest
# releases, both still require p256 0.13. In shipped builds p256 only verifies OIDC ID token
# signatures, on public data. embedded-tls signs with a device key, but is only built for
# zenoh-nano's own tests (its `tls` feature): enabling that feature anywhere else makes this
# advisory real.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0387"
reason = "crypto-bigint 0.5 via p256 0.13 (openidconnect, embedded-tls); only public data in shipped builds, see comment."

