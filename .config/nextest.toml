experimental = ["setup-scripts"]

# Tests that link `sorg-tests` register cell fixtures as wasm classes. The
# fixtures are built once, up front, instead of by each test: concurrent
# builds serialize on the target dir's cargo lock and ate the tests' budgets.
[scripts.setup.build-cell-fixtures]
command = { command-line = "swarm/sorg-tests/build-cell-fixtures.sh", relative-to = "workspace-root" }

[[profile.default.scripts]]
filter = 'rdeps(sorg-tests)'
setup = 'build-cell-fixtures'

# `serial-integration` is for tests that genuinely cannot share the host:
# `swarm-telemetry` builds its swarm inline (bypassing the `sorg-tests` harness)
# so it stays on the default zenoh multicast group, and `sorg-tests`' own mqtt
# tests bind a fixed broker port. Every other swarm integration suite is
# network-isolated — `sorg-tests` gives
# each test *process* a private multicast group (`set_up_swarm_with_config` /
# `set_up_killable_swarm` / `test_session`), and `filestore-client` disables
# multicast outright — so they run in parallel. The per-package `slow-timeout`s
# are unrelated to serialization and stay.
[test-groups]
serial-integration = { max-threads = 1 }

# Raised above the 40s that served the serial runs back when every test compiled
# its cell fixtures at runtime; the fixtures are prebuilt by
# `build-cell-fixtures` now, and the budget has not been re-tuned since.
[[profile.default.overrides]]
filter = 'package(sorg-execution) & kind(test)'
platform = 'cfg(unix)'
slow-timeout = { period = "15s", terminate-after = 6 }

[[profile.default.overrides]]
filter = 'package(sorg-orchestration) & kind(test)'
platform = 'cfg(unix)'
slow-timeout = { period = "10s", terminate-after = 4 }

# sorg-client's cells::timeout tests wait out a 12s cell init. The budget was
# raised above the 40s the lighter sorg-client tests are fine with back when the
# tests also compiled their cell fixture at runtime; the fixtures are prebuilt
# by `build-cell-fixtures` now, and the budget has not been re-tuned since.
[[profile.default.overrides]]
filter = 'package(sorg-client) & kind(test)'
platform = 'cfg(unix)'
slow-timeout = { period = "15s", terminate-after = 6 }

[[profile.default.overrides]]
filter = 'package(filestore-client) & kind(test)'
platform = 'cfg(unix)'
slow-timeout = { period = "5s", terminate-after = 4 }

# sorg-tests' own mqtt tests stand up a broker on the fixed port 1883
# (`set_up_mqtt_broker`), so they can't run alongside each other — keep serial.
[[profile.default.overrides]]
filter = 'package(sorg-tests) & kind(test)'
platform = 'cfg(unix)'
test-group = 'serial-integration'
slow-timeout = { period = "5s", terminate-after = 4 }

[[profile.default.overrides]]
filter = 'package(introspection-client) & kind(test)'
platform = 'cfg(unix)'
slow-timeout = { period = "5s", terminate-after = 4 }

[[profile.default.overrides]]
filter = 'package(swarm-telemetry) & kind(test)'
platform = 'cfg(unix)'
test-group = 'serial-integration'
slow-timeout = { period = "10s", terminate-after = 4 }
