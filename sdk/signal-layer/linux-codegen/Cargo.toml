[package]
name              = "linux-codegen"
version.workspace = true
edition.workspace = true
license           = "MIT OR Apache-2.0"
authors.workspace = true
publish.workspace = true

[[bin]]
name = "linux-codegen"
path = "src/main.rs"

[lib]
name = "linux_codegen"
path = "src/lib.rs"

[dependencies]
pipeline-codegen     = { workspace = true }
pipeline-backend-api = { workspace = true }
anyhow               = { workspace = true }
clap                 = { workspace = true }
indexmap             = { version = "2" }
proc-macro2          = { workspace = true }
quote                = { workspace = true }
serde                = { workspace = true, features = ["derive"] }
serde_yaml           = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
