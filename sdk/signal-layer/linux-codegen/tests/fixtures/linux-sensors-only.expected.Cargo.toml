[workspace]

[package]
name    = "linux_sensors_pipeline"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "linux_sensors_pipeline"
path = "src/main.rs"

[dependencies]
signal-layer-ipc      = { path = "../signal-layer-ipc" }
signal-layer-linux-rt = { path = "../../../swarm/signal-layer/signal-layer-linux-rt" }
linux-i2c-shim        = { path = "../../../swarm/signal-layer/linux-i2c-shim" }
signal-layer-core     = { path = "../signal-layer-core" }
signal-layer-types    = { package = "myrmic-signal-layer-types", path = "../signal-layer-types" }
tokio                 = { version = "1", features = ["full"] }
tokio-stream          = { version = "0.1", features = ["time"] }
critical-section      = { version = "1", features = ["std"] }
log                   = { version = "0.4", default-features = false }
env_logger            = "0.11"
bme280_driver = { path = "../../../signal-modules/drivers/bme280", package = "bme280-driver" }
veml7700_driver = { path = "../../../signal-modules/drivers/veml7700", package = "veml7700-driver" }
moving_average = { path = "../../../signal-modules/steps/moving-average", package = "moving-average" }

[dev-dependencies]
tokio    = { version = "1", features = ["full"] }
tempfile = "3"
