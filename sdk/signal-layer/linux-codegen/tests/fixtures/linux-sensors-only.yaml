# Linux sensors-only pipeline fixture.
# BME280 + VEML7700 sources + moving-average step + retained taps.
# Used by linux-codegen snapshot test (SR-7).
pipeline:
  id: linux-sensors

sources:
  - id: bme280
    device: bme280
    config:
      sample_interval_ms: 1000

  - id: veml7700
    device: veml7700
    config:
      sample_interval_ms: 2000

steps:
  - id: avg_temp
    op: moving-average
    input: bme280.temperature
    config:
      window: 4

taps:
  - name: temperature
    kind: retained
    type: f32
    source: bme280.temperature

  - name: humidity
    kind: retained
    type: f32
    source: bme280.humidity

  - name: lux
    kind: retained
    type: f32
    source: veml7700.lux

  - name: avg_temperature
    kind: retained
    type: f32
    source: avg_temp
