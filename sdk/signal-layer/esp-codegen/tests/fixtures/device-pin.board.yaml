# Board manifest for the device-pin fixture only.
#
# Kept separate from golden-board.yaml because board peripherals are emitted for
# every device in the manifest, whether or not the pipeline uses it. Putting a
# device with an optional pin on the shared board would inject that pin into the
# sensors-only and outlet-bearing fixtures too.
id: golden-board-device-pin
chip: esp32c6

buses:
  i2c0:
    transport: i2c
    pins:
      scl: 10
      sda: 11
    freq_khz: 400

gpios:
  # Cell-exported pins only; ccs811's `nint` (GPIO23) is reserved and must not appear here.
  general_purpose: [0, 1]

devices:
  - id: bme280
    driver: bme280
    bus: i2c0
    hardware:
      i2c_addr: 0x76

  # Wires the driver's optional `nint` line, so the pin is built as a Flex in
  # the board peripherals and handed to the source task.
  - id: ccs811
    driver: ccs811
    bus: i2c0
    hardware:
      i2c_addr: 0x5A
    pins:
      nint: 23
