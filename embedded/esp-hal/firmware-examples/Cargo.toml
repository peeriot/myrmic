[package]
name = "firmware-examples"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish = false
description = "Worked examples of building a myrmic firmware on esp-firmware. Doubles as the template for a new firmware crate."

[lints]
workspace = true

[features]
default = ["esp32c6"]

# Target SoC. A firmware crate declares its own chip feature and forwards it:
# `esp_firmware::board!` and `esp_firmware_build::configure()` both read the
# chip from the crate that invokes them.
esp32c5 = ["esp-firmware/esp32c5", "ble", "rmt"]
esp32c6 = ["esp-firmware/esp32c6", "rmt", "tsens"]
esp32c61 = ["esp-firmware/esp32c61", "ble"]

ble = ["esp-firmware/ble"]

# The chip has an RMT peripheral. esp-hal configures the module out on the
# C61, so `rmt-led` cannot build there.
rmt = []

# The chip has an on-die temperature sensor (TSENS). Only C6 has it configured
# in esp-hal; C61 doesn't expose it despite the hardware being present.
tsens = []

[[bin]]
name = "rmt-led"
required-features = ["rmt"]

[[bin]]
name = "internal-temp"
required-features = ["tsens"]

[dependencies]
esp-firmware = { workspace = true }

# Only `own_ble` and `native-cell` use these; `default` needs esp-firmware alone.
embassy-executor = { workspace = true }
embassy-time = { workspace = true }
log = { workspace = true }

[build-dependencies]
esp-firmware-build = { workspace = true }
