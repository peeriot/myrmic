# Flash partition layout for the ESP32-C61.
#
# Based on ESP32-C61-DevKitC-1 (8 MB flash): 6 MB firmware + 2 MB AOT fills the
# 8 MB. The firmware partition holds the app; the AOT region holds the 64 KB
# metadata block and the XIP WASM module.
#
# See embedded/esp-hal/modem-esp32/partitions.toml.example for a description of the knobs and how to override them.

[partitions]
firmware_size = "6M"
aot_size = "2M"
flash_size = "8M"
