[package]
name              = "modem-esp32"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["esp32c6"]

# Target SoC. Selected here rather than inherited: `esp_firmware::board!`
# expands `pins_from_peripherals!`, which reads the chip feature from the crate
# that invokes it — so every firmware crate declares its own and forwards.
esp32c5  = ["esp-firmware/esp32c5", "wasm-runtime/esp32c5", "ble"]
esp32c6  = ["esp-firmware/esp32c6", "wasm-runtime/esp32c6"]
esp32c61 = ["esp-firmware/esp32c61", "wasm-runtime/esp32c61", "ble"]

# BLE host stack (NimBLE). Enabled automatically on esp32c5 and esp32c61.
ble = ["esp-firmware/ble"]

# The Signal Layer pipeline. Gates the generated pipeline module (see
# `pipeline!()` in src/main.rs) and the driver/step crates it can use. The
# pipeline is generated from a board manifest + pipeline YAML at build time
# (build.rs); which pair is chosen by the SIGNAL_LAYER_BOARD / SIGNAL_LAYER_PIPELINE
# env vars, defaulting to this chip's devkit board and the basic-sensors starter.
pipeline = [
    "dep:ads1115-driver",
    "dep:bme280-driver",
    "dep:bmp180-driver",
    "dep:ccs811-driver",
    "dep:gpio-output-driver",
    "dep:gpio-output-feedback-driver",
    "dep:pwm-output-driver",
    "dep:sim-source-driver",
    "dep:veml7700-driver",
    "dep:wsen-itds-driver",
    "dep:cadence",
    "dep:fan-curve",
    "dep:hysteresis",
    "dep:max-value",
    "dep:min-value",
    "dep:moving-average",
    "dep:threshold-trigger",
]

# Emit structured heap-stats snapshots at key milestones over the log channel.
report = ["esp-firmware/report"]

# Measure peak main-stack usage. For local profiling only — never ship.
stack-hwm = ["esp-firmware/stack-hwm"]

# Watchdog timeout characterization (#1014). Bench measurement only.
wdt-characterize = ["esp-firmware/wdt-characterize"]

# Test-only fault injection for HIL watchdog tests. Never ship.
wdt-selftest = ["esp-firmware/wdt-selftest"]

[dependencies]
esp-firmware = { workspace = true }
# Enabled for its chip feature by the esp32c* features above; the generated
# pipeline code reaches it through esp-firmware's re-exports.
wasm-runtime = { workspace = true }

# Signal Layer driver and step crates, seeded for every module the reference
# pipelines use so any of them compiles from a board + pipeline YAML. Only the
# modules a pipeline actually uses reach the image. Enabled by the `pipeline`
# feature; the generated code reaches them through esp-firmware's re-exports, so
# no other infrastructure dependency is needed here.
ads1115-driver              = { workspace = true, optional = true }
bme280-driver               = { workspace = true, optional = true }
bmp180-driver               = { workspace = true, optional = true }
ccs811-driver               = { workspace = true, optional = true }
gpio-output-driver          = { workspace = true, optional = true }
gpio-output-feedback-driver = { workspace = true, optional = true }
pwm-output-driver           = { workspace = true, optional = true }
sim-source-driver           = { workspace = true, optional = true }
veml7700-driver             = { workspace = true, optional = true }
wsen-itds-driver            = { workspace = true, optional = true }
cadence           = { workspace = true, optional = true }
fan-curve         = { workspace = true, optional = true }
hysteresis        = { workspace = true, optional = true }
max-value         = { workspace = true, optional = true }
min-value         = { workspace = true, optional = true }
moving-average    = { workspace = true, optional = true }
threshold-trigger = { workspace = true, optional = true }

[build-dependencies]
esp-firmware-build = { workspace = true }
