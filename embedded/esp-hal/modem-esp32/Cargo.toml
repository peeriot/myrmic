[package]
name              = "modem-esp32"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["esp32c6"]

# Target SoC. Selected here rather than inherited: `esp_firmware::board!`
# expands `pins_from_peripherals!`, which reads the chip feature from the crate
# that invokes it — so every firmware crate declares its own and forwards.
esp32c5  = ["esp-firmware/esp32c5", "wasm-runtime/esp32c5", "ble"]
esp32c6  = ["esp-firmware/esp32c6", "wasm-runtime/esp32c6"]
esp32c61 = ["esp-firmware/esp32c61", "wasm-runtime/esp32c61", "ble"]

# BLE host stack (NimBLE). Enabled automatically on esp32c5 and esp32c61.
ble = ["esp-firmware/ble"]

# Marker feature: gates all pipeline-dependent firmware code. Use
# `#[cfg(feature = "pipeline")]` without hard-coding a specific pipeline name.
# The pipeline-{name} feature and driver/node optional deps are managed by
# esp-codegen (pipeline_regen.sh) and must not be committed.
pipeline = [
    "dep:signal-layer-core",
    "dep:signal-layer-types",
    "dep:embassy-embedded-hal",
    "wasm-runtime/signal-layer",
]

# Emit structured heap-stats snapshots at key milestones over the log channel.
report = ["esp-firmware/report"]

# Measure peak main-stack usage. For local profiling only — never ship.
stack-hwm = ["esp-firmware/stack-hwm"]

# Watchdog timeout characterization (#1014). Bench measurement only.
wdt-characterize = ["esp-firmware/wdt-characterize"]

# Test-only fault injection for HIL watchdog tests. Never ship.
wdt-selftest = ["esp-firmware/wdt-selftest"]

[dependencies]
esp-firmware = { workspace = true }
log          = { workspace = true }

# Named by the esp-codegen-generated pipeline module.
esp-hal      = { workspace = true, features = ["log-04", "unstable", "rt"] }
embassy-sync = { workspace = true }
embassy-time = { workspace = true }
static_cell  = { workspace = true }
wasm-runtime = { workspace = true }

# Infrastructure optional deps for the `pipeline` feature (committed).
# Driver/node optional deps are managed by esp-codegen and must not be committed.
signal-layer-core    = { workspace = true, optional = true }
signal-layer-types   = { workspace = true, optional = true }
embassy-embedded-hal = { workspace = true, optional = true }

[build-dependencies]
esp-firmware-build = { workspace = true }
