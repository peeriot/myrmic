# Flash partition layout for this firmware.
#
# The default (3M firmware + 1M AOT, on a 4M flash) fits a build with the `ble`
# feature — the NimBLE host stack costs ~0.5 MB of flash and the image comes out
# around 2.06 MB — but leaves under 1 MB for the AOT module. The C6/C61 take up
# to 8 MB, so give the firmware 4 MB and the AOT region 2 MB.
#
# Drop this file to return to the 4 MB default.

[partitions]
firmware_size = "4M"
aot_size      = "2M"
flash_size    = "8M"
