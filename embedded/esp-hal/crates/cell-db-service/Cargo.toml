[package]
name              = "cell-db-service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
esp32c5  = ["esp-hal/esp32c5", "esp-watchdog/esp32c5", "wasm-runtime/esp32c5"]
esp32c6  = ["esp-hal/esp32c6", "esp-watchdog/esp32c6", "wasm-runtime/esp32c6"]
esp32c61 = ["esp-hal/esp32c61", "esp-watchdog/esp32c61", "wasm-runtime/esp32c61"]

# Marker: the hosting firmware ships the NimBLE host, so the exec registration
# advertises the BLE capability tag.
ble = []

[dependencies]
cfg-match            = { workspace = true }
embassy-futures      = { workspace = true }
embassy-sync         = { workspace = true }
embassy-time         = { workspace = true }
esp-hal              = { workspace = true, features = ["unstable"] }
log                  = { workspace = true }
portable-atomic-util = { workspace = true }
thiserror            = { workspace = true }
# Peeriot org
zenoh-result = { workspace = true }
# local
cell-protocol   = { workspace = true }
db-client       = { workspace = true, features = ["nano"] }
esp-watchdog = { workspace = true }
myrmic-common   = { workspace = true }
myrmic-tags     = { workspace = true }
wasm-runtime    = { workspace = true }
wasm-storage    = { workspace = true }
zenoh-nano      = { workspace = true, features = ["getrandom-custom"] }
