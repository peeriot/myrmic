[package]
name              = "examples-esp"
version.workspace = true
edition.workspace = true
license           = "MIT-0"
publish           = false
build             = "build.rs"

[lints]
workspace = true

[features]
default = ["esp32c6"]
esp32   = ["esp-rtos/esp32", "esp-hal/esp32", "esp-backtrace/esp32", "esp-println/esp32", "esp-radio/esp32", "esp-bootloader-esp-idf/esp32", "esp-metadata-generated/esp32"]
esp32c2 = ["esp-rtos/esp32c2", "esp-hal/esp32c2", "esp-backtrace/esp32c2", "esp-println/esp32c2", "esp-radio/esp32c2", "esp-bootloader-esp-idf/esp32c2", "esp-metadata-generated/esp32c2"]
esp32c3 = ["esp-rtos/esp32c3", "esp-hal/esp32c3", "esp-backtrace/esp32c3", "esp-println/esp32c3", "esp-radio/esp32c3", "esp-bootloader-esp-idf/esp32c3", "esp-metadata-generated/esp32c3"]
esp32c6 = ["esp-rtos/esp32c6", "esp-hal/esp32c6", "esp-backtrace/esp32c6", "esp-println/esp32c6", "esp-radio/esp32c6", "esp-bootloader-esp-idf/esp32c6", "esp-metadata-generated/esp32c6"]
esp32s2 = ["esp-rtos/esp32s2", "esp-hal/esp32s2", "esp-backtrace/esp32s2", "esp-println/esp32s2", "esp-radio/esp32s2", "esp-bootloader-esp-idf/esp32s2", "esp-metadata-generated/esp32s3"]
esp32s3 = ["esp-rtos/esp32s3", "esp-hal/esp32s3", "esp-backtrace/esp32s3", "esp-println/esp32s3", "esp-radio/esp32s3", "esp-bootloader-esp-idf/esp32s3", "esp-metadata-generated/esp32s3"]
esp32h2 = ["esp-rtos/esp32h2", "esp-hal/esp32h2", "esp-backtrace/esp32h2", "esp-println/esp32h2", "esp-radio/esp32h2", "esp-bootloader-esp-idf/esp32h2", "esp-metadata-generated/esp32h2"]

[dependencies]
log                    = { workspace = true }
embedded-io-async      = { workspace = true }
embassy-executor       = { workspace = true }
embassy-net            = { workspace = true }
embassy-sync           = { workspace = true }
edge-nal               = { workspace = true }
edge-nal-embassy       = { workspace = true }
esp-backtrace          = { workspace = true, features = ["panic-handler", "println"] }
esp-hal                = { workspace = true, features = ["log-04", "unstable", "exception-handler"] }
esp-rtos               = { workspace = true, features = ["esp-radio", "embassy"] }
esp-alloc              = { workspace = true }
esp-println            = { workspace = true, features = ["default", "log-04"] }
esp-radio              = { workspace = true, features = ["ble", "wifi", "log-04", "unstable"] }
esp-bootloader-esp-idf = { workspace = true, features = ["log-04"] }
esp-metadata-generated = { workspace = true }
zenoh-nano             = { workspace = true, features = ["getrandom-custom", "tls", "trouble-accept", "trouble-connect"] }
zenoh-traits           = { workspace = true, default-features = false, features = ["zenoh-nano"] }
swarm-onboarding       = { workspace = true, default-features = false, features = ["log"] }
#tinyrlibc = { version = "0.5", default-features = false, features = ["utoa", "strtoul"] }
embassy-futures = { workspace = true }
embassy-time    = { workspace = true }
static_cell     = { workspace = true }
portable-atomic = { workspace = true }
bt-hci          = { workspace = true }
trouble-host    = { workspace = true, features = ["peripheral", "central", "gatt"] }
x509-cert       = { workspace = true }
embedded-tls    = { workspace = true, features = ["rustpki"] }
der             = { workspace = true, features = ["heapless"] }
signature       = { workspace = true }
# rand_core 0.6: embedded-tls requires 0.6 API; workspace uses 0.9 — cannot share
rand_core = "0.6"
