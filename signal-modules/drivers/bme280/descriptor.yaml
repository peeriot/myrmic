id: bme280
category: sensor-drivers
description: >
  Bosch BME280 environmental sensor — temperature, pressure, and humidity over I2C.
requires:
  buses:
    - transport: i2c
outputs:
  - name: temperature
    type: f32
    unit: "°C"
  - name: pressure
    type: f32
    unit: hPa
  - name: humidity
    type: f32
    unit: "%RH"
config_schema:
  i2c_addr:
    scope: hardware
    rust_type: u8
    default: 0x76
    description: "I2C address (SDO to GND=0x76, SDO to VCC=0x77)"
  osrs_t:
    scope: application
    rust_type: Oversampling
    default: X1
    # Variants: Skip | X1 | X2 | X4 | X8 | X16
    description: "Temperature oversampling — higher values reduce noise at the cost of longer conversion time."
  osrs_p:
    scope: application
    rust_type: Oversampling
    default: X1
    # Variants: Skip | X1 | X2 | X4 | X8 | X16
    description: "Pressure oversampling — higher values reduce noise at the cost of longer conversion time."
  osrs_h:
    scope: application
    rust_type: Oversampling
    default: X1
    # Variants: Skip | X1 | X2 | X4 | X8 | X16
    description: "Humidity oversampling — higher values reduce noise at the cost of longer conversion time."
  filter:
    scope: application
    rust_type: Filter
    default: Off
    # Variants: Off | X2 | X4 | X8 | X16
    description: "IIR filter coefficient — smooths short-term pressure/temperature fluctuations."
  t_sb:
    scope: application
    rust_type: Standby
    default: Ms0_5
    # Variants: Ms0_5 | Ms62_5 | Ms125 | Ms250 | Ms500 | Ms1000 | Ms10 | Ms20
    description: "Normal-mode standby time — inactive period between measurements."
  sample_interval_ms:
    scope: application
    rust_type: u64
    default: 1000
    description: Polling interval in milliseconds
